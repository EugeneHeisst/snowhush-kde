[package]
name = "snowhush-kde"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Snowhush for KDE Plasma (Wayland): snow that settles on your windows"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.18"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
